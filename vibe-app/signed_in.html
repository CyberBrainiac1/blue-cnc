<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signed in</title>
</head>
<body>
  <p id="note">Signing in to Onshape...</p>
  <script>
    // The Worker sends the sign-in popup here with the tokens in the URL fragment.
    // Hand them to the GRBL Prep page that opened this popup, then close.
    const fields = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
    history.replaceState(null, '', location.pathname);
    if (window.opener) {
      window.opener.postMessage({ grblPrepSignIn: fields }, location.origin);
      window.close();
    } else {
      document.getElementById('note').textContent = fields.error
        ? `Sign-in didn't work: ${fields.error}`
        : 'Signed in. You can close this window.';
    }
  </script>
</body>
</html>
