<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signed in</title>
</head>
<body>
  <p id="note">Signing in to Onshape...</p>
  <script>
    // The Worker sends the sign-in here with the tokens in the URL fragment. Hand them to the
    // GRBL Prep page that asked: the page that opened this popup, or the page this hidden frame
    // sits in. Only a page on this same site can receive them.
    const fields = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
    history.replaceState(null, '', location.pathname);
    const page = window.opener || (window.parent !== window ? window.parent : null);
    if (page) {
      page.postMessage({ grblPrepSignIn: fields }, location.origin);
      if (window.opener) window.close();
    } else {
      document.getElementById('note').textContent = fields.error
        ? `Sign-in didn't work: ${fields.error}`
        : 'Signed in. You can close this window.';
    }
  </script>
</body>
</html>
